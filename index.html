<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Preethi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}
body{
font-family:'Poppins',sans-serif;
background:#000;
color:white;
overflow-x:hidden;
}

/* 🌙 Star Background */
.stars{
position:fixed;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
animation:moveStars 60s linear infinite;
z-index:-2;
}
@keyframes moveStars{
from{background-position:0 0;}
to{background-position:0 1000px;}
}

/* 🎬 Cinematic Sections */
.section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
opacity:0;
transform:translateY(40px);
transition:all 1.2s ease;
}
.section.show{
opacity:1;
transform:translateY(0);
}

h1{
font-family:'Great Vibes',cursive;
font-size:3.5rem;
margin-bottom:20px;
}

button{
padding:14px 28px;
border:none;
border-radius:40px;
margin:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.yes{background:#ff4081;color:white;font-size:1.8rem;}
.no{background:#444;color:white;}

button:hover{
transform:scale(1.1);
box-shadow:0 0 20px #ff4081;
}

/* Puppy */
.puppy{display:none;margin-top:20px;}
.puppy img{width:220px;border-radius:20px;}

.special-photo{width:260px;border-radius:20px;margin:20px 0;}

.option-btn{
background:white;
color:black;
display:block;
margin:10px auto;
width:90%;
max-width:400px;
}

/* Gifts */
.gift-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
max-width:500px;
}
.gift{
background:#111;
padding:20px;
border-radius:20px;
font-size:40px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
min-height:120px;
transition:0.4s;
}
.gift:hover{transform:scale(1.1);background:#ff4081;}

.secret{
display:none;
margin-top:30px;
font-size:1.6rem;
color:#ff4081;
animation:fadeIn 1.5s ease;
}

/* 💍 Yes Forever */
.forever-btn{
display:none;
margin-top:20px;
font-size:1.5rem;
background:linear-gradient(45deg,#ff4081,#ff80ab);
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* 📖 Slideshow */
.slideshow{display:none;margin-top:40px;}
.slide{display:none;font-size:1.2rem;}

/* 💑 Gallery */
.gallery{
display:none;
margin-top:30px;
position:relative;
width:300px;
height:300px;
}
.gallery img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
border-radius:20px;
opacity:0;
animation:fadeGallery 12s infinite;
}
.gallery img:nth-child(1){animation-delay:0s;}
.gallery img:nth-child(2){animation-delay:4s;}
.gallery img:nth-child(3){animation-delay:8s;}
@keyframes fadeGallery{
0%{opacity:0;}
10%{opacity:1;}
30%{opacity:1;}
40%{opacity:0;}
100%{opacity:0;}
}

/* 🎆 Grand Finale */
.grand-finale{
position:fixed;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:fadeIn 1s ease;
}
.grand-finale h1{
font-size:4rem;
color:#ff4081;
animation:pulse 1.5s infinite;
}

/* Popup */
.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
}
.popup-box{
background:white;
color:black;
padding:30px;
border-radius:20px;
}
.red{color:red;font-weight:bold;}

/* 💫 Sparkle Cursor */
.sparkle{
position:fixed;
pointer-events:none;
font-size:18px;
animation:spark 1s linear forwards;
}
@keyframes spark{
0%{opacity:1;}
100%{opacity:0;transform:translateY(-20px);}
}

.counter{margin-top:20px;color:#ff4081;}
</style>
</head>

<body>

<div class="stars"></div>

<audio id="bgMusic" autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<!-- 💝 SECTION 1 -->
<div class="section" id="sec1">
<h1 id="typing"></h1>
<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<div class="puppy" id="puppyBox">
<img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
<h2>You just made my universe brighter 🥹💖</h2>
</div>

<div class="counter" id="loveCounter"></div>
</div>

<!-- 📖 SECTION 2 -->
<div class="section" id="specialSection">
<img src="special-day.jpg" class="special-photo">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

<h2 style="margin-top:40px;">🎁 6 Surprise Gifts For You</h2>

<div class="gift-container">
<div class="gift" onclick="openGift(this)">🎁</div>
<div class="gift" onclick="openGift(this)">🎁</div>
<div class="gift" onclick="openGift(this)">🎁</div>
<div class="gift" onclick="openGift(this)">🎁</div>
<div class="gift" onclick="openGift(this)">🎁</div>
<div class="gift" onclick="openGift(this)">🎁</div>
</div>

<div class="secret" id="secretGift">
💌 Preethi… Will you stay with me forever? 💍❤️
</div>

<button class="forever-btn" id="foreverBtn" onclick="grandFinale()">💍 YES FOREVER 💖</button>
</div>

<!-- 🎆 GRAND FINALE -->
<div class="grand-finale" id="finale">
<h1>Forever With You ❤️</h1>
<h2>My heart is yours… always.</h2>
</div>

<div class="popup" id="popup">
<div class="popup-box" id="popupText"></div>
</div>

<script>

/* Section reveal */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
sections.forEach(sec=>{
if(sec.getBoundingClientRect().top<window.innerHeight-100){
sec.classList.add("show");
}
});
});
sections.forEach(s=>s.classList.add("show"));

/* Typing */
const text="Preethi, will you be my Valentine? 💝";
let i=0;
function type(){if(i<text.length){typing.innerHTML+=text.charAt(i);i++;setTimeout(type,80);}}
type();

/* Counter */
const startDate=new Date("2024-02-07");
function updateCounter(){
const days=Math.floor((new Date()-startDate)/(1000*60*60*24));
loveCounter.innerHTML="💖 Loving you for "+days+" days and counting...";
}
updateCounter();

/* Valentine */
function valentineYes(){
showPopup("You don’t have any other option too 😏");
puppyBox.style.display="block";
}
function valentineNo(){
showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}
function wrongAnswer(){showPopup("😈 It’s punishment time");}
function rightAnswer(){showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");}

/* Gifts */
let opened=0;
function openGift(el){
if(!el.dataset.opened){
el.innerHTML="💖";
el.dataset.opened=true;
opened++;
if(opened===6){
secretGift.style.display="block";
foreverBtn.style.display="inline-block";
}
}
}

/* Grand Finale */
function grandFinale(){
finale.style.display="flex";
setTimeout(()=>{finale.style.display="none";},5000);
}

/* Popup */
function showPopup(msg){
popupText.innerHTML=msg;
popup.style.display="flex";
setTimeout(()=>popup.style.display="none",2500);
}

/* Sparkle Cursor */
document.addEventListener("mousemove",e=>{
const spark=document.createElement("div");
spark.className="sparkle";
spark.innerHTML="✨";
spark.style.left=e.pageX+"px";
spark.style.top=e.pageY+"px";
document.body.appendChild(spark);
setTimeout(()=>spark.remove(),1000);
});
</script>

</body>
</html>
