<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#fbc2eb);
    background-size:300% 300%;
    animation:bg 10s ease infinite;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    text-align:center;
    max-width:600px;
    padding:20px;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    font-size:1rem;
    opacity:0.9;
    margin-bottom:20px;
}

button{
    padding:14px 28px;
    margin:10px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
}

.yes{
    font-size:1.8rem;
    background:white;
    color:#ff4d88;
}

.no{
    font-size:1rem;
    background:#333;
    color:white;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px rgba(255,255,255,0.7);
}

.puppy-box{
    display:none;
    margin-top:20px;
    animation:fadeIn 1s ease;
}

.puppy-box img{
    width:220px;
    border-radius:20px;
}

.love-line{
    font-family:'Great Vibes',cursive;
    font-size:1.6rem;
    margin-top:15px;
}

.special-photo{
    width:260px;
    border-radius:20px;
    margin:25px 0;
    box-shadow:0 0 25px rgba(255,255,255,0.5);
}

.option-btn{
    display:block;
    margin:10px auto;
    padding:12px;
    background:white;
    color:#333;
    border-radius:25px;
    font-weight:600;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-box{
    background:white;
    color:#333;
    padding:30px;
    border-radius:20px;
    text-align:center;
    font-size:1.2rem;
}

.red{color:#ff0000;font-weight:600;}

.heart{
    position:fixed;
    font-size:22px;
    animation:float 6s linear infinite;
    opacity:0.6;
}

@keyframes float{
    0%{transform:translateY(0);opacity:1}
    100%{transform:translateY(-100vh);opacity:0}
}

.burst{
    position:fixed;
    font-size:30px;
    animation:explode 1.5s ease forwards;
}

@keyframes explode{
    0%{transform:scale(0);opacity:1}
    100%{transform:scale(3);opacity:0}
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<div class="container">

<h1>💝 Preethi, will you be my Valentine?</h1>
<div class="subtitle">Because my heart chose you long before this question ❤️</div>

<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<div class="puppy-box" id="puppyBox">
    <img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
    <div class="love-line">You just made my heart the happiest in the world 🥹💖</div>
</div>

<hr style="margin:40px 0;opacity:0.3;">

<div id="specialSection" style="display:none;">

<img src="special-day.jpg" class="special-photo">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

</div>

</div>

<div class="popup" id="popup">
    <div class="popup-box" id="popupText"></div>
</div>

<script>
function valentineYes(){
    showPopup("You don’t have any other option too 😏");
    document.getElementById("puppyBox").style.display="block";
    document.getElementById("specialSection").style.display="block";
}

function valentineNo(){
    showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){
    showPopup("😈 It’s punishment time");
}

function rightAnswer(){
    showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");
    for(let i=0;i<20;i++){
        const h=document.createElement("div");
        h.className="burst";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        h.style.top=Math.random()*100+"vh";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),1500);
    }
}

function showPopup(msg){
    document.getElementById("popupText").innerHTML=msg;
    document.getElementById("popup").style.display="flex";
    setTimeout(()=>{document.getElementById("popup").style.display="none"},2200);
}

/* Floating hearts background */
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},800);
</script>

</body>
</html>
