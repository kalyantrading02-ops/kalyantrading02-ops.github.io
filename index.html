<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Preethi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* 🌙 STAR BACKGROUND */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://www.transparenttextures.com/patterns/stardust.png');
    animation:moveStars 60s linear infinite;
    z-index:-1;
}
@keyframes moveStars{
    from{background-position:0 0;}
    to{background-position:0 1000px;}
}

.section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:3.5rem;
    margin-bottom:20px;
}

h2{margin:15px 0;}

button{
    padding:14px 28px;
    border:none;
    border-radius:40px;
    margin:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.yes{
    font-size:1.8rem;
    background:#ff4081;
    color:white;
}

.no{
    font-size:1rem;
    background:#444;
    color:white;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #ff4081;
}

/* Puppy */
.puppy{
    display:none;
    margin-top:20px;
}
.puppy img{
    width:220px;
    border-radius:20px;
}

/* Ring animation */
.ring{
    font-size:60px;
    position:fixed;
    top:-100px;
    animation:dropRing 1s ease forwards;
}
@keyframes dropRing{
    to{top:40%; transform:translateY(-50%);}
}

/* Fireworks */
.firework{
    position:fixed;
    font-size:30px;
    animation:explode 1.5s ease forwards;
}
@keyframes explode{
    0%{transform:scale(0);opacity:1;}
    100%{transform:scale(3);opacity:0;}
}

/* Photo Section */
.special-photo{
    width:260px;
    border-radius:20px;
    margin:20px 0;
}

.option-btn{
    background:white;
    color:black;
    display:block;
    margin:10px auto;
    width:90%;
    max-width:400px;
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
}
.popup-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
}
.red{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="stars"></div>

<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<!-- 💝 SECTION 1 -->
<div class="section">

<h1 id="typing"></h1>

<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<div class="puppy" id="puppyBox">
    <img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
    <h2>You just made my universe brighter 🥹💖</h2>
</div>

</div>

<!-- 📖 SECTION 2 -->
<div class="section" id="specialSection" style="display:none;">

<img src="special-day.jpg" class="special-photo">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

</div>

<div class="popup" id="popup">
<div class="popup-box" id="popupText"></div>
</div>

<script>
/* ✍️ Typing Effect */
const text="Preethi, will you be my Valentine? 💝";
let i=0;
function type(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text.charAt(i);
        i++;
        setTimeout(type,80);
    }
}
type();

/* YES click */
function valentineYes(){
    showPopup("You don’t have any other option too 😏");

    document.getElementById("puppyBox").style.display="block";
    document.getElementById("specialSection").style.display="flex";

    /* Ring drop */
    const ring=document.createElement("div");
    ring.className="ring";
    ring.innerHTML="💍";
    document.body.appendChild(ring);
    setTimeout(()=>ring.remove(),2000);

    /* Fireworks */
    for(let j=0;j<30;j++){
        const f=document.createElement("div");
        f.className="firework";
        f.innerHTML="❤️";
        f.style.left=Math.random()*100+"vw";
        f.style.top=Math.random()*100+"vh";
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1500);
    }
}

/* NO click */
function valentineNo(){
    showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){
    showPopup("😈 It’s punishment time");
}

function rightAnswer(){
    showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");
}

function showPopup(msg){
    document.getElementById("popupText").innerHTML=msg;
    document.getElementById("popup").style.display="flex";
    setTimeout(()=>document.getElementById("popup").style.display="none",2500);
}
</script>

</body>
</html>
