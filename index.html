<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(45deg,#ff6b6b,#feca57,#ff9ff3,#54a0ff);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    font-family:cursive;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    text-align:center;
    max-width:90%;
}

button{
    padding:14px 24px;
    margin:10px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:1.2rem;
}

.yes{
    font-size:2.2rem;
    background:#ff4d6d;
    color:white;
}

.no{
    font-size:1rem;
    background:#4d79ff;
    color:white;
}

/* Puppy GIF */
.puppy-box{
    display:none;
    margin-top:20px;
}

.puppy-box img{
    width:220px;
    border-radius:20px;
}

/* Special section */
.special-photo{
    width:260px;
    max-width:90%;
    border-radius:20px;
    margin:20px 0;
}

.option-btn{
    display:block;
    margin:10px auto;
    background:#ffe3ec;
    color:black;
}

/* Gift Boxes */
.gift-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.gift{
    font-size:50px;
    cursor:pointer;
    transition:0.4s;
}

.gift:hover{
    transform:scale(1.2);
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-box{
    background:white;
    color:black;
    padding:25px;
    border-radius:20px;
    font-size:1.4rem;
    text-align:center;
}

.red{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<div class="container">

<!-- VALENTINE QUESTION -->
<h1>💝 Preethi, will you be my Valentine?</h1>
<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<!-- LOVE PUPPY GIF -->
<div class="puppy-box" id="puppyBox">
    <img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif" alt="Cute Love Puppy">
</div>

<hr style="margin:40px 0;">

<!-- NEXT QUESTION -->
<div id="specialSection" style="display:none;">

<img src="special-day.jpg" class="special-photo" alt="Our Special Day">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

<!-- 🎁 6 SURPRISE GIFT BOXES -->
<hr style="margin:40px 0;">
<h2><strong>🎁 6 Surprise Love Gifts For You</strong></h2>

<div class="gift-container">
    <div class="gift" onclick="openGift(this,1)">🎁</div>
    <div class="gift" onclick="openGift(this,2)">🎁</div>
    <div class="gift" onclick="openGift(this,3)">🎁</div>
    <div class="gift" onclick="openGift(this,4)">🎁</div>
    <div class="gift" onclick="openGift(this,5)">🎁</div>
    <div class="gift" onclick="openGift(this,6)">🎁</div>
</div>

</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-box" id="popupText"></div>
</div>

<script>
function valentineYes(){
    showPopup("You don’t have any other option too 😏");
    document.getElementById("puppyBox").style.display="block";
    document.getElementById("specialSection").style.display="block";
}

function valentineNo(){
    showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){
    showPopup("😈 It’s punishment time");
}

function rightAnswer(){
    showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");
}

function openGift(element, number){
    const messages = {
        1: "💖 You are the most beautiful part of my life.",
        2: "🌸 Every moment with you feels like magic.",
        3: "💫 My heart feels safest with you.",
        4: "🥹 You are my peace in every chaos.",
        5: "🌹 I fall for you more every single day.",
        6: "❤️ No matter what happens, I will always choose you."
    };

    element.innerHTML = messages[number];
    element.style.fontSize = "16px";
    element.style.padding = "10px";
    element.style.width = "150px";
    element.style.height = "150px";
    element.style.display = "flex";
    element.style.alignItems = "center";
    element.style.justifyContent = "center";
    element.style.background = "white";
    element.style.color = "#ff4081";
    element.style.borderRadius = "20px";
    element.style.textAlign = "center";
}

function showPopup(msg){
    document.getElementById("popupText").innerHTML=msg;
    document.getElementById("popup").style.display="flex";
    setTimeout(()=>{document.getElementById("popup").style.display="none"},2200);
}
</script>

</body>
</html>
