<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Preethi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* Star Background */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://www.transparenttextures.com/patterns/stardust.png');
    animation:moveStars 60s linear infinite;
    z-index:-1;
}
@keyframes moveStars{
    from{background-position:0 0;}
    to{background-position:0 1000px;}
}

.section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:3.5rem;
    margin-bottom:20px;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:40px;
    margin:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.yes{background:#ff4081;color:white;font-size:1.8rem;}
.no{background:#444;color:white;}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #ff4081;
}

.puppy{display:none;margin-top:20px;}
.puppy img{width:220px;border-radius:20px;}

.special-photo{width:260px;border-radius:20px;margin:20px 0;}

.option-btn{
    background:white;
    color:black;
    display:block;
    margin:10px auto;
    width:90%;
    max-width:400px;
}

/* Gifts */
.gift-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:30px;
    max-width:500px;
}

.gift{
    background:#111;
    padding:20px;
    border-radius:20px;
    font-size:40px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:120px;
    transition:0.4s;
}

.gift:hover{transform:scale(1.1);background:#ff4081;}

.secret{
    display:none;
    margin-top:30px;
    font-size:1.6rem;
    color:#ff4081;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    background:random;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    0%{transform:translateY(-100vh);}
    100%{transform:translateY(100vh);}
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
}
.popup-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
}
.red{color:red;font-weight:bold;}

.counter{
    margin-top:20px;
    font-size:1.2rem;
    color:#ff4081;
}
</style>
</head>

<body>

<div class="stars"></div>

<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<div class="section">

<h1 id="typing"></h1>

<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<div class="puppy" id="puppyBox">
<img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
<h2>You just made my universe brighter 🥹💖</h2>
</div>

<div class="counter" id="loveCounter"></div>

</div>

<div class="section" id="specialSection" style="display:none;">

<img src="special-day.jpg" class="special-photo">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

<h2 style="margin-top:40px;">🎁 6 Surprise Gifts For You</h2>

<div class="gift-container">
<div class="gift" onclick="openGift(this,1)">🎁</div>
<div class="gift" onclick="openGift(this,2)">🎁</div>
<div class="gift" onclick="openGift(this,3)">🎁</div>
<div class="gift" onclick="openGift(this,4)">🎁</div>
<div class="gift" onclick="openGift(this,5)">🎁</div>
<div class="gift" onclick="openGift(this,6)">🎁</div>
</div>

<div class="secret" id="secretGift">
💌 Preethi… Will you stay with me forever? 💍❤️
</div>

</div>

<div class="popup" id="popup">
<div class="popup-box" id="popupText"></div>
</div>

<script>

/* Typing */
const text="Preethi, will you be my Valentine? 💝";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,80);
}}
type();

/* Love Counter */
const startDate=new Date("2024-02-07"); // CHANGE THIS DATE
function updateCounter(){
const now=new Date();
const diff=now-startDate;
const days=Math.floor(diff/(1000*60*60*24));
document.getElementById("loveCounter").innerHTML=
"💖 Loving you for "+days+" days and counting...";
}
updateCounter();

/* Valentine */
function valentineYes(){
showPopup("You don’t have any other option too 😏");
document.getElementById("puppyBox").style.display="block";
document.getElementById("specialSection").style.display="flex";
}

function valentineNo(){
showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){showPopup("😈 It’s punishment time");}
function rightAnswer(){showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");}

/* Gifts */
let opened=0;
function openGift(el,num){
const messages={
1:"💖 You are my favorite notification.",
2:"🌙 You are my peace.",
3:"🌸 Your smile heals me.",
4:"💫 Life is better with you.",
5:"🥹 You are my safe place.",
6:"❤️ Forever is better with you."
};
if(!el.dataset.opened){
el.innerHTML=messages[num];
el.style.fontSize="14px";
el.style.background="#ff4081";
el.dataset.opened=true;
opened++;
if(opened===6){
launchConfetti();
document.getElementById("secretGift").style.display="block";
}
}
}

/* Confetti */
function launchConfetti(){
for(let i=0;i<150;i++){
const conf=document.createElement("div");
conf.className="confetti";
conf.style.left=Math.random()*100+"vw";
conf.style.background=["#ff4081","#ffeb3b","#00e5ff","#ffffff"][Math.floor(Math.random()*4)];
conf.style.animationDuration=(Math.random()*2+2)+"s";
document.body.appendChild(conf);
setTimeout(()=>conf.remove(),3000);
}
}

function showPopup(msg){
document.getElementById("popupText").innerHTML=msg;
document.getElementById("popup").style.display="flex";
setTimeout(()=>document.getElementById("popup").style.display="none",2500);
}

</script>

</body>
</html>
