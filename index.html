<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Preethi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background:black;
    color:white;
}

/* SECTION STYLE */
.section{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    transition:1s ease;
}

/* VIDEO STYLE BACKGROUND */
.valentine-bg{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    animation:bgmove 8s ease infinite alternate;
}

@keyframes bgmove{
    from{background-position:0%}
    to{background-position:100%}
}

/* TEXT */
h1{
    font-family:'Great Vibes',cursive;
    font-size:3.5rem;
    margin-bottom:20px;
    animation:fadeIn 2s ease;
}

h2{
    font-size:1.5rem;
    margin-bottom:20px;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(40px)}
    to{opacity:1;transform:translateY(0)}
}

/* BUTTONS */
button{
    padding:14px 28px;
    border:none;
    border-radius:40px;
    margin:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.yes{
    font-size:1.8rem;
    background:white;
    color:#ff416c;
}

.no{
    font-size:1rem;
    background:#222;
    color:white;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(255,255,255,0.6);
}

/* Puppy */
.puppy{
    display:none;
    margin-top:20px;
    animation:fadeIn 1.5s ease;
}

.puppy img{
    width:220px;
    border-radius:20px;
}

/* Photo Section */
.photo-section{
    background:linear-gradient(135deg,#fc5c7d,#6a82fb);
}

.special-photo{
    width:260px;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 0 30px rgba(255,255,255,0.5);
}

.option-btn{
    background:white;
    color:#333;
    margin:10px auto;
    display:block;
    width:90%;
    max-width:400px;
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.popup-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    text-align:center;
    font-size:1.2rem;
}

.red{color:red;font-weight:bold;}

/* Heart explosion */
.burst{
    position:fixed;
    font-size:30px;
    animation:explode 1.5s ease forwards;
}

@keyframes explode{
    0%{transform:scale(0);opacity:1}
    100%{transform:scale(3);opacity:0}
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<!-- SECTION 1 -->
<div class="section valentine-bg">
    <h1>Preethi, will you be my Valentine? 💝</h1>
    <button class="yes" onclick="valentineYes()">YES</button>
    <button class="no" onclick="valentineNo()">NO</button>

    <div class="puppy" id="puppyBox">
        <img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
        <h2>You just made my world brighter 🥹💖</h2>
    </div>
</div>

<!-- SECTION 2 -->
<div class="section photo-section" id="specialSection" style="display:none;">
    <img src="special-day.jpg" class="special-photo">

    <h2><strong>✨ What makes this day so special for us?</strong></h2>

    <button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
    <button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
    <button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
    <button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>
</div>

<div class="popup" id="popup">
    <div class="popup-box" id="popupText"></div>
</div>

<script>
function valentineYes(){
    showPopup("You don’t have any other option too 😏");
    document.getElementById("puppyBox").style.display="block";
    document.getElementById("specialSection").style.display="flex";
}

function valentineNo(){
    showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){
    showPopup("😈 It’s punishment time");
}

function rightAnswer(){
    showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");
    for(let i=0;i<25;i++){
        const h=document.createElement("div");
        h.className="burst";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        h.style.top=Math.random()*100+"vh";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),1500);
    }
}

function showPopup(msg){
    document.getElementById("popupText").innerHTML=msg;
    document.getElementById("popup").style.display="flex";
    setTimeout(()=>{document.getElementById("popup").style.display="none"},2300);
}
</script>

</body>
</html>
