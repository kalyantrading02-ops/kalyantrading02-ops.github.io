<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
    font-family:'Comic Sans MS', cursive;
    overflow-x:hidden;
    color:white;
}

@keyframes gradient{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* Floating hearts */
.heart-float{
    position:fixed;
    bottom:-20px;
    font-size:22px;
    animation:floatUp 6s linear infinite;
    opacity:0.7;
}
@keyframes floatUp{
    0%{transform:translateY(0) scale(0.6);opacity:1}
    100%{transform:translateY(-110vh) scale(1.2);opacity:0}
}

.container{
    text-align:center;
    max-width:90%;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

h1{
    font-size:2.4rem;
    text-shadow:0 0 15px #ff4da6;
}

h2{
    font-size:1.6rem;
    margin-top:20px;
}

button{
    padding:14px 26px;
    margin:10px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:0.3s;
}

.yes{
    font-size:2.2rem;
    background:#ff4da6;
    color:white;
}

.no{
    font-size:1rem;
    background:#5555ff;
    color:white;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px rgba(255,255,255,0.6);
}

.special-photo{
    width:260px;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.option-btn{
    display:block;
    margin:10px auto;
    background:white;
    color:black;
    font-weight:bold;
}

/* Puppy */
.puppy-box{
    display:none;
    margin:20px 0;
    animation:fadeIn 1s ease;
}

.puppy-box img{
    width:200px;
    border-radius:20px;
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-box{
    background:white;
    color:black;
    padding:25px;
    border-radius:20px;
    font-size:1.3rem;
    text-align:center;
}

.red{
    color:red;
    font-weight:bold;
}

/* Burst hearts */
.burst-heart{
    position:fixed;
    font-size:26px;
    animation:burst 1.5s ease-out forwards;
}

@keyframes burst{
    0%{transform:scale(0);opacity:1}
    100%{transform:scale(3);opacity:0}
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1><strong>💝 Preethi, will you be my Valentine?</strong></h1>
<button class="yes" onclick="valentineYes()">YES</button>
<button class="no" onclick="valentineNo()">NO</button>

<div class="puppy-box" id="puppyBox">
    <img src="https://media.tenor.com/3x63SN3KX4kAAAAC/cute-puppy-love.gif">
</div>

<hr style="margin:40px 0;">

<div id="specialSection" style="display:none;">

<img src="special-day.jpg" class="special-photo">

<h2><strong>✨ What makes this day so special for us?</strong></h2>

<button class="option-btn" onclick="wrongAnswer()">🤍 The first time we met alone at Matunga</button>
<button class="option-btn" onclick="wrongAnswer()">☕ The first time we went to Ram Ashraya together</button>
<button class="option-btn" onclick="rightAnswer()">🫂 The first time I pampered and took care of you during your periods</button>
<button class="option-btn" onclick="wrongAnswer()">🎤 The day you gave me a long speech about my mistake</button>

</div>
</div>

<div class="popup" id="popup">
    <div class="popup-box" id="popupText"></div>
</div>

<script>
function valentineYes(){
    showPopup("😏 You don’t have any other option too");
    document.getElementById("puppyBox").style.display="block";
    document.getElementById("specialSection").style.display="block";
}

function valentineNo(){
    showPopup("<span class='red'>❌ Invalid choice.<br>System has detected you are already my Valentine</span>");
}

function wrongAnswer(){
    showPopup("😈 It’s punishment time");
}

function rightAnswer(){
    showPopup("❤️ That’s exactly what I wanted to hear. Come here, you’ve earned it 😘");
    for(let i=0;i<18;i++){
        const h=document.createElement("div");
        h.className="burst-heart";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        h.style.top=Math.random()*100+"vh";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),1500);
    }
}

function showPopup(msg){
    document.getElementById("popupText").innerHTML=msg;
    document.getElementById("popup").style.display="flex";
    setTimeout(()=>{document.getElementById("popup").style.display="none"},2200);
}

/* Floating hearts continuously */
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart-float";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},400);
</script>

</body>
</html>
